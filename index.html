<style>
:root{
  --bg:#fff; --fg:#171717; --muted:#faf6f1; --muted-fg:#737373; --border:#eee4d9; --input:#e4d8cb;
  --primary:#c2410c; --orange:#ea580c; --red:#dc2626; --secondary:#fff3e4; --secondary-fg:#8a3a12;
  --green:#15803d; --green-bg:#e8f6ec; --amber:#a16207; --amber-bg:#fdf3d3; --red-bg:#fde8e8; --grey-bg:#f1f1f1;
}
*{box-sizing:border-box}
html{font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,"Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.6}
#app{min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
.wrap{max-width:1152px;margin:0 auto;padding:0 16px;width:100%}
.muted{color:var(--muted-fg)}
.small{font-size:13px}.xs{font-size:12px}
.mono{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:12px;color:var(--muted-fg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.span2{grid-column:span 2}
@media(max-width:800px){.g2,.g3,.g5{grid-template-columns:1fr}.span2{grid-column:auto}.hide-sm{display:none!important}}
.demobar{background:#1f1f1f;color:#fff;font-size:12px}
.demobar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:6px;padding-bottom:6px;max-width:none}
.demobar b{color:#ffb37a}
.demobar button{background:#333;border:1px solid #555;color:#fff;border-radius:6px;padding:3px 9px;font-size:12px}
.demobar button:hover{background:#444}
.demobar .sp{flex:1}
.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);border-bottom:1px solid var(--border)}
.header .bar{height:4px;background:linear-gradient(90deg,var(--orange),var(--red))}
.header .inner{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:baseline;gap:8px}
.logo b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.logo .o{color:var(--orange)}.logo .r{color:var(--red)}
.nav{display:flex;gap:24px;font-size:14px}
.nav a:hover{color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid transparent;background:var(--primary);color:#fff;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s}
.btn:hover:not(:disabled){background:#a8370a}
.btn.outline{background:#fff;color:var(--fg);border-color:var(--input)}
.btn.outline:hover:not(:disabled){background:var(--muted)}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.ghost:hover:not(:disabled){background:var(--muted)}
.btn.secondary{background:var(--secondary);color:var(--secondary-fg)}
.btn.secondary:hover:not(:disabled){background:#ffe8cc}
.btn.danger{background:#fff;color:var(--red);border-color:#f3c0c0}
.btn.danger:hover:not(:disabled){background:var(--red-bg)}
.btn.lg{padding:10px 20px;font-size:15px}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.block{width:100%}
.card{border:1px solid var(--border);border-radius:14px;background:#fff;padding:20px}
.card h3{font-size:16px}
a.card{display:block;transition:background .15s,border-color .15s}
a.card:hover{border-color:#e7b79a;background:#fff8f3}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;background:var(--primary);color:#fff;white-space:nowrap}
.badge.sec{background:var(--secondary);color:var(--secondary-fg)}
.badge.out{background:#fff;color:var(--fg);border:1px solid var(--border);font-weight:500;padding:3px 12px;font-size:13px}
.badge.ok{background:var(--green-bg);color:var(--green)}
.badge.wait{background:var(--amber-bg);color:var(--amber)}
.badge.ng{background:var(--red-bg);color:var(--red)}
.badge.grey{background:var(--grey-bg);color:#555}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.f .opts{display:flex;gap:16px;flex-wrap:wrap;font-weight:400;font-size:14px;padding:6px 0}
.f .opts label{display:flex;gap:6px;align-items:center}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;border:1px solid var(--input);border-radius:8px;padding:8px 10px;background:#fff;font-size:14px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid rgba(234,88,12,.35);outline-offset:1px}
.req{color:var(--red)}
.flash{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--green-bg);color:var(--green);border:1px solid #bfe3c9}
.flash.ng{background:var(--red-bg);color:var(--red);border-color:#f3c0c0}
.note{border-radius:10px;padding:10px 14px;font-size:13px;background:var(--secondary);color:var(--secondary-fg)}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted-fg);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--muted)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
a.lnk{color:var(--primary)}a.lnk:hover{text-decoration:underline}
.empty{padding:28px;text-align:center;color:var(--muted-fg);border:1px solid var(--border);border-radius:12px}
td.empty{border:0}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted-fg);white-space:nowrap}dl.kv dd{margin:0;overflow-wrap:anywhere}

.hero h1{font-size:44px;line-height:1.2;letter-spacing:-.02em}
@media(max-width:800px){.hero .wrap{grid-template-columns:1fr;padding-top:40px;padding-bottom:40px}.hero h1{font-size:28px}}
.section{padding:56px 0}
.section.alt{background:var(--muted);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.stitle{margin-bottom:28px}
.stitle h2{font-size:24px}
.step{display:flex;gap:16px;border:1px solid var(--border);border-radius:14px;padding:20px}
.step .ic{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--orange),var(--red))}
.cta{background:linear-gradient(90deg,var(--primary),var(--red));color:#fff}
.cta .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding-top:56px;padding-bottom:56px}
.footer{margin-top:auto;border-top:1px solid var(--border);background:var(--muted)}
.footer .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;padding-top:40px;padding-bottom:40px;font-size:14px}

.footer a:hover{color:var(--primary)}
.page{padding:40px 16px;display:flex;flex-direction:column;gap:28px}
.narrow{max-width:460px;margin:0 auto;width:100%}
.mid{max-width:820px;margin:0 auto;width:100%}
.progress{height:6px;border-radius:99px;background:var(--border);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--red))}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps a{font-size:12px;border:1px solid var(--border);border-radius:99px;padding:2px 10px;color:var(--muted-fg)}
.steps a.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.rowbox{border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--muted)}

.subnav a.on{border-color:var(--primary);color:var(--primary);font-weight:600}

// ---------- helpers ----------
function esc(v) {
  return String(v === null || v === undefined ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function byId(list, id) { id = Number(id); for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
function nextId(list) { return list.reduce(function (m, x) { return Math.max(m, x.id); }, 0) + 1; }
function yen(n) { return n === null || n === undefined || n === "" ? "—" : Number(n).toLocaleString("ja-JP") + "円"; }
function fmtDate(d) { return d ? String(d).replace(/-/g, "/") : "—"; }
function fmtMonth(m) { return m ? String(m).slice(0, 7).replace("-", "年") + "月" : ""; }
function period(a, b) { return a || b ? (fmtMonth(a) || "?") + " 〜 " + (fmtMonth(b) || "現在") : "—"; }
function age(birth) {
  if (!birth) return "";
  var b = new Date(birth), n = new Date();
  var a = n.getFullYear() - b.getFullYear();
  if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
  return a >= 0 && a < 120 ? a + "歳" : "";
}
function dash(v) { return v === null || v === undefined || v === "" ? "—" : esc(v); }
function company(job) { return byId(S.companies, job.cid) || { name: "—", no: "" }; }
function listed(job) { return job.active && job.review === "approved"; }
function me() { return S.member ? byId(S.member.kind === "company" ? S.companies : S.individuals, S.member.id) : null; }
function staff() { return S.staff ? (S.staff === "admin" ? STAFF["admin@example.com"] : STAFF["viewer@example.com"]) : null; }
function canEdit() { return S.staff === "admin"; }
function pendingCounts() {

    candidates: S.individuals.filter(function (i) { return i.review === "pending"; }).length,

  };
}

function reviewBadge(kind, x) {
  var st = x.review, label, cls;
  if (st === "draft") { label = "未提出"; cls = "grey"; }
  else if (st === "pending") { label = kind === "application" ? "スタッフ確認中" : "審査中"; cls = "wait"; }
  else if (st === "rejected") { label = kind === "application" ? "見送り" : "差戻し"; cls = "ng"; }
  else if (kind === "job") { label = x.active ? "掲載中" : "掲載停止"; cls = x.active ? "ok" : "grey"; }
  else if (kind === "application") { label = "企業へ紹介済"; cls = "ok"; }
  else { label = "承認済"; cls = "ok"; }
  return '<span class="badge ' + cls + '">' + label + "</span>";
}

function select(name, options, value, placeholder, attrs) {
  var h = '<select name="' + name + '" ' + (attrs || "") + ">";
  if (placeholder !== null) h += '<option value="">' + esc(placeholder || "選択してください") + "</option>";
  options.forEach(function (o) {
    var v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o;
    h += '<option value="' + esc(v) + '"' + (String(value) === String(v) ? " selected" : "") + ">" + esc(l) + "</option>";
  });
  return h + "</select>";
}

function salaryOk(job) {
  if (!filters.salary) return true;
  var r = SALARY_RANGE[filters.salary];
  return job.salary !== null && job.salary >= r[0] && job.salary <= r[1];
}
function jobResults(ind) {
  var applied = S.applications.filter(function (a) { return a.iid === ind.id; }).map(function (a) { return a.jid; });
  var rows = S.jobs.filter(function (j) {
    return listed(j) && (!filters.category || j.track === filters.category) && (!filters.industry || j.industry === filters.industry) &&
      (!filters.type || j.type.indexOf(filters.type) >= 0) && (!filters.loc || j.loc.indexOf(filters.loc) >= 0) && salaryOk(j);
  });
  if (!rows.length) return '<p class="empty">対象データがありません。</p>';
  return '<p class="small muted" style="margin-bottom:8px">' + rows.length + '件</p><div class="grid g2">' + rows.map(function (j) {
    var c = company(j), done = applied.indexOf(j.id) >= 0;
    return '<article class="card col" style="padding:16px;font-size:14px"><div class="row"><span class="badge">' + TRACK[j.track] + "</span><b>" + esc(j.type) + "</b></div><p>" + esc(c.name) + "</p>" +
      (j.desc ? '<p class="small muted">' + esc(j.desc) + "</p>" : "") +
      '<dl class="kv"><dt>業種：</dt><dd>' + esc(j.industry) + "</dd><dt>勤務地：</dt><dd>" + esc(j.loc) + "</dd><dt>給与：</dt><dd><b>" + (j.salary === null ? "—" : yen(j.salary) + "／月") + "</b></dd>" +
      (j.features ? "<dt>特徴：</dt><dd>" + esc(j.features) + "</dd>" : "") + "</dl>" +
      '<div class="row between" style="margin-top:auto"><span class="mono">' + c.no + " " + String(j.no).padStart(2, "0") + "</span>" +
      (done ? '<button class="btn sm outline" disabled>応募済み</button>' : '<button class="btn sm" data-act="apply" data-id="' + j.id + '">応募する</button>') + "</div></article>";
  }).join("") + "</div>";
}

function fieldHtml(f, value, name) {
  var label = f.l + (f.req ? ' <span class="req">*</span>' : ""), inner;
  if (f.type === "select") inner = select(name, OPT[f.opts], value, "選択してください");
  else if (f.type === "radio") inner = '<span class="opts">' + OPT[f.opts].map(function (o) { return '<label><input type="radio" name="' + name + '" value="' + esc(o) + '"' + (value === o ? " checked" : "") + ">" + esc(o) + "</label>"; }).join("") + "</span>";
  else if (f.type === "textarea") inner = '<textarea name="' + name + '" rows="6" maxlength="4000">' + esc(value) + "</textarea>";
  else inner = '<input type="' + f.type + '" name="' + name + '" value="' + esc(value) + '" maxlength="200">';
  if (f.type === "radio") return '<div class="f' + (f.span ? " span2" : "") + '" style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">' + label + inner + "</div>";
  return '<label class="f' + (f.span ? " span2" : "") + '">' + label + inner + "</label>";
}

  if (idx < 0) return redirect("#/profile/basic");

  if (st.slug === "confirm") {
    body = '<p class="small muted">内容を確認し、「登録してマイページへ」を押すとスタッフの審査に提出されます。</p>' + profileView(ind, true);
  } else if (st.goals) {

      return '<div class="col" style="gap:8px"><b class="small">' + title + "</b>" + keys.map(function (k) { return '<label class="row" style="font-size:14px"><input type="checkbox" name="goal" value="' + k + '"' + (ind.goals.indexOf(k) >= 0 ? " checked" : "") + ">" + GOALS[k] + "</label>"; }).join("") + "</div>";
    };
    body = '<div class="grid g2">' + grp("求職希望 (Job seeking)", ["engineer", "ssw", "titp"]) + grp("留学希望 (Study in Japan)", ["university", "vocational", "languageSchool"]) + "</div>";
  } else if (st.rows) {

    }).join("") + '<button type="button" class="btn outline" style="align-self:flex-start" data-act="addRow">＋ ' + st.rowLabel + "を追加</button>";

  }

function collectStep(form, ind) {
  var st = STEPS.find(function (s) { return s.slug === form.dataset.slug; });
  var fd = new FormData(form);
  if (st.goals) ind.goals = fd.getAll("goal");
  else if (st.rows) {
    var out = [];
    for (var i = 0; i < Number(form.dataset.count); i++) {
      var row = {}, any = false;
      st.fields.forEach(function (f) { row[f.n] = String(fd.get(f.n + "__" + i) || "").trim(); if (row[f.n]) any = true; });
      if (any) out.push(row);
    }
    ind[st.rows] = out;
  } else if (st.fields) {
    st.fields.forEach(function (f) { ind[f.n] = String(fd.get(f.n) || "").trim(); });
  }
  return st;
}

    var p = byId(S.individuals, a.iid), j = byId(S.jobs, a.jid);
    return [fmtDate(a.created), '<a class="lnk" href="#/admin/members/' + p.id + '">' + esc(p.name) + "</a>", '<a class="lnk" href="#/admin/jobs/' + j.id + '">' + esc(j.type) + "</a>", esc(company(j).name),
      reviewBadge("application", a) + (a.review === "pending" ? " " + reviewButtons("application", a.id) : "") + (a.review === "rejected" && a.reason ? '<p class="xs muted">' + esc(a.reason) + "</p>" : ""),
      a.review === "approved" ? select("status", Object.keys(APP_STATUS).map(function (k) { return [k, APP_STATUS[k]]; }), a.status, null, 'data-change="appStatus" data-id="' + a.id + '" style="width:auto" aria-label="対応状況"' + dis) : "—"];
  })));

// ---------- router, actions, forms ----------
var pendingRedirect = null, pendingScroll = null, lastPath = null;
function redirect(hash) { pendingRedirect = hash; return null; }
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
function say(text, ng) { flashMsg = { text: text, ng: !!ng }; }
function today() { return daysAgo(0); }

function parseHash() {
  var raw = location.hash.replace(/^#/, "") || "/";
  var parts = raw.split("?"), q = {};
  (parts[1] || "").split("&").forEach(function (kv) { if (kv) { var p = kv.split("="); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ""); } });
  return { path: parts[0].replace(/\/+$/, "") || "/", q: q };
}

function route(path, q) {
  var m;
  if (path === "/") return viewHome();
  if (path === "/demo") return viewDemoGuide();
  if (path === "/login") return viewLogin(q);
  if (path === "/register") return viewRegister();
  if (path === "/register/individual") return viewRegisterForm("individual");
  if (path === "/register/corporate") return viewRegisterForm("corporate");
  if (path === "/mypage") return viewMyPage();
  if (path === "/profile") return redirect("#/profile/basic");
  if ((m = path.match(/^\/profile\/([a-z]+)$/))) return viewWizard(m[1]);
  if (path === "/employer") return viewEmployerProfile();
  if (path === "/employer/jobs") return viewEmployerJobs();
  if (path === "/employer/jobs/new") return viewEmployerJobNew();
  if ((m = path.match(/^\/employer\/jobs\/(\d+)$/))) return viewEmployerJob(m[1]);
  if ((m = path.match(/^\/employer\/applicants\/(\d+)$/))) return viewEmployerApplicant(m[1]);
  if (path === "/admin/login") return viewAdminLogin();
  if (path === "/admin") return viewAdminDash();
  if (path === "/admin/reviews") return viewReviews(q);
  if (path === "/admin/members") return viewMembers();
  if ((m = path.match(/^\/admin\/members\/(\d+)$/))) return viewMember(m[1]);
  if (path === "/admin/companies") return viewCompanies();
  if (path === "/admin/schools") return viewSchools();
  if (path === "/admin/recruitments") return viewRecruitments();
  if (path === "/admin/jobs") return viewAdminJobs();
  if ((m = path.match(/^\/admin\/jobs\/(\d+)$/))) return viewAdminJob(m[1]);
  if (path === "/admin/applications") return viewAdminApps();
  return redirect("#/");
}

function render() {
  var h = parseHash();
  pendingRedirect = null;
  var html = route(h.path, h.q);
  if (html === null) { location.replace(pendingRedirect || "#/"); return; }
  document.getElementById("app").innerHTML = html;
  if (pendingScroll) {
    var el = document.getElementById(pendingScroll);
    pendingScroll = null;
    if (el) el.scrollIntoView();
  } else if (lastPath !== h.path) window.scrollTo(0, 0);
  lastPath = h.path;
}

function loginMember(email) {
  email = String(email || "").trim().toLowerCase();
  var ind = S.individuals.find(function (i) { return i.email.toLowerCase() === email; });
  var co = S.companies.find(function (c) { return c.email.toLowerCase() === email; });
  if (!ind && !co) return false;
  S.member = ind ? { kind: "individual", id: ind.id } : { kind: "company", id: co.id };
  save();
  go(ind ? "#/mypage" : "#/employer/jobs");
  return true;
}

var ACT = {
  nav: function (d) { go(d.to); },
  scroll: function (d) { pendingScroll = d.to; go("#/"); },
  track: function (d) { filters = { category: d.track, industry: "", type: "", loc: "", salary: "" }; go(me() && S.member.kind === "individual" ? "#/mypage" : "#/login"); },
  quick: function (d) {
    if (d.as === "admin") { S.staff = "admin"; save(); go("#/admin"); }
    else loginMember(d.as === "company" ? "hr@example-kensetsu.co.jp" : "akram@example.com");
  },
  reset: function () {
    if (!confirm("デモのデータを初期状態に戻します。よろしいですか？")) return;
    try { localStorage.removeItem(KEY); } catch (e) { /* nothing stored */ }
    S = seed(); save();
    say("デモを初期状態に戻しました。");
    go("#/");
  },
  logout: function () { S.member = null; save(); say("ログアウトしました。"); go("#/login"); },
  staffLogout: function () { S.staff = null; save(); go("#/admin/login"); },
  loginAs: function (d) { loginMember(d.email); },
  staffAs: function (d) { S.staff = d.key; save(); go("#/admin"); },
  print: function () { window.print(); },
  period: function (d) { S.period = d.p; save(); render(); },
  apply: function (d) {
    var ind = me(), job = byId(S.jobs, d.id);
    if (!ind || !job) return;
    if (ind.review === "draft") { say("応募の前にプロフィールを提出してください。", true); render(); return; }
    if (S.applications.some(function (a) { return a.iid === ind.id && a.jid === job.id; })) return;
    S.applications.push({ id: nextId(S.applications), iid: ind.id, jid: job.id, status: "new", review: "pending", reason: "", created: today() });
    save();
    say("「" + job.type + "」に応募しました。スタッフが内容を確認し、企業におつなぎします。");
    render();
    window.scrollTo(0, 0);
  },
  addRow: function (d, el) {
    var form = el.closest("form"), ind = me(), st = collectStep(form, ind);
    ind[st.rows].push({ _new: true });
    // An empty row would be dropped on collect, so keep the count explicit.
    save(); render();
  },
  delRow: function (d, el) {
    var form = el.closest("form"), ind = me(), st = STEPS.find(function (s) { return s.slug === form.dataset.slug; });
    var fd = new FormData(form), out = [];
    for (var i = 0; i < Number(form.dataset.count); i++) {
      if (i === Number(d.i)) continue;
      var row = {};
      st.fields.forEach(function (f) { row[f.n] = String(fd.get(f.n + "__" + i) || "").trim(); });
      out.push(row);
    }
    ind[st.rows] = out; save(); render();
  },
  review: function (d) {
    if (!canEdit()) return;
    var ok = d.ok === "1", list = d.kind === "job" ? S.jobs : d.kind === "candidate" ? S.individuals : S.applications;
    var x = byId(list, d.id);
    if (!x) return;
    var reason = "";
    if (!ok) {
      reason = prompt("差戻しの理由を入力してください（本人の画面に表示されます）", "");
      if (reason === null) return;
    }
    x.review = ok ? "approved" : "rejected";
    x.reason = reason.trim();
    save();
    var what = { job: "求人", candidate: "プロフィール", application: "応募" }[d.kind];
    say(what + "を" + (ok ? "承認しました。" : "差戻しました。"), !ok);
    render();
  },
  toggleJob: function (d) {
    if (!canEdit()) return;
    var j = byId(S.jobs, d.id);
    j.active = !j.active; save();
    say(j.active ? "掲載を再開しました。" : "掲載を停止しました。");
    render();
  }
};

var FORM = {
  login: function (fd) {
    if (fd.get("password") !== DEMO_PASSWORD || !loginMember(fd.get("email"))) { say("メールアドレスまたはパスワードが正しくありません。", true); render(); }
  },
  staffLogin: function (fd) {
    var st = STAFF[String(fd.get("email") || "").trim().toLowerCase()];
    if (!st || fd.get("password") !== DEMO_PASSWORD) { say("ログインIDまたはパスワードが正しくありません。", true); render(); return; }
    S.staff = st.key; save(); go("#/admin");
  },
  register: function (fd, form) {
    var email = String(fd.get("email") || "").trim().toLowerCase(), name = String(fd.get("name") || "").trim();
    var taken = S.individuals.concat(S.companies).some(function (x) { return x.email.toLowerCase() === email; }) || STAFF[email];
    if (taken) { say("このメールアドレスは既に登録されています。", true); render(); return; }
    if (form.dataset.kind === "corporate") {
      var cid = nextId(S.companies);
      S.companies.push({ id: cid, no: "2026100001" + String(cid).padStart(2, "0"), email: email, name: name, rep: "", headcount: "", industry: String(fd.get("industry") || ""), pref: "", city: "", contact: "", founded: "", url: "", intro: "", created: today() });
      S.member = { kind: "company", id: cid }; save();
      say("法人会員登録が完了しました。会社情報を入力してください。");
      go("#/employer");
    } else {
      var iid = nextId(S.individuals);
      S.individuals.push({ id: iid, no: "1026100001" + String(iid).padStart(2, "0"), email: email, name: name, kana: "", gender: "", birth: "", nationality: "", residence: "", lang: "", hasSpouse: "", hasChildren: "", mobile: "", visa: "", visaExpiry: "", intro: "", strengths: "", motivation: "", hobbies: "", goals: [], languages: [], education: [], work: [], review: "draft", reason: "", resumeFile: "", submitted: "", created: today() });
      S.member = { kind: "individual", id: iid }; save();
      say("会員登録が完了しました。プロフィールを入力してください。");
      go("#/profile/basic");
    }
  },
  wizard: function (fd, form) {
    var ind = me(), st = collectStep(form, ind), idx = STEPS.indexOf(st);
    if (st.slug === "basic" && (!ind.name || !ind.gender || !ind.birth)) { save(); say("氏名・性別・生年月日を入力してください。", true); render(); return; }
    if (st.slug === "confirm") {
      if (!ind.name || !ind.gender || !ind.birth) { say("基本情報（氏名・性別・生年月日）が未入力です。", true); go("#/profile/basic"); return; }
      ind.review = "pending"; ind.reason = ""; ind.submitted = today(); save();
      say("プロフィールを提出しました。スタッフの審査をお待ちください。");
      go("#/mypage");
      return;
    }
    save();
    go("#/profile/" + STEPS[idx + 1].slug);
  },
  company: function (fd) {
    var c = me();
    ["name", "rep", "founded", "headcount", "industry", "pref", "city", "contact", "url", "intro"].forEach(function (k) { c[k] = String(fd.get(k) || "").trim(); });
    if (!c.name) c.name = "（名称未設定）";
    save(); say("会社情報を保存しました。"); render(); window.scrollTo(0, 0);
  },
  job: function (fd) {
    var c = me(), g = function (k) { return String(fd.get(k) || "").trim(); };
    var no = S.jobs.filter(function (j) { return j.cid === c.id; }).reduce(function (m, j) { return Math.max(m, j.no); }, 0) + 1;
    S.jobs.push({ id: nextId(S.jobs), cid: c.id, no: no, track: g("track"), industry: g("industry"), type: g("type"), work: g("work"), emp: g("emp"), desc: g("desc"), loc: g("loc"), from: g("from"), to: g("to"), holidays: g("holidays"), salary: g("salary") ? Number(g("salary")) : null, features: g("features"), active: true, review: "pending", reason: "", created: today() });
    save();
    say("求人を登録しました。スタッフの審査後にサイトへ掲載されます。");
    go("#/employer/jobs");
  }
};

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  e.preventDefault();
  ACT[el.dataset.act](el.dataset, el);
});
document.addEventListener("submit", function (e) {
  var form = e.target.closest("form[data-form]");
  if (!form) return;
  e.preventDefault();
  FORM[form.dataset.form](new FormData(form), form);
});
document.addEventListener("input", function (e) {
  var k = e.target.dataset && e.target.dataset.filter;
  if (!k) return;
  filters[k] = e.target.value;
  var box = document.getElementById("results");
  if (box && me()) box.innerHTML = jobResults(me());
});
document.addEventListener("change", function (e) {
  var k = e.target.dataset && e.target.dataset.change;
  if (k === "resume") {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    me().resumeFile = f.name; save();
    say("履歴書ファイル「" + f.name + "」を登録しました。"); render(); window.scrollTo(0, 0);
  } else if (k === "appStatus") {
    if (!canEdit()) return;
    byId(S.applications, e.target.dataset.id).status = e.target.value; save();
    say("対応状況を更新しました。"); render();
  }
});
window.addEventListener("hashchange", render);
render();
</script>
