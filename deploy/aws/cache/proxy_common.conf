# Shared by every location in nginx.conf: how a request is handed on to Caddy's
# inner door, which shares it between the two copies of the app.

proxy_http_version 1.1;
proxy_set_header Connection "";
# The visitor's host name and address exactly as Caddy reported them. Nothing
# is added, so the app still sees the real visitor (login throttling uses it).
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
# Pages are stored already compressed (gzip) for browsers that accept it, so
# a stored page is handed out with no further work. $page_encoding is "gzip"
# or empty (nginx.conf); the inner door compresses, the front door does not
# compress a second time.
proxy_set_header Accept-Encoding $page_encoding;

proxy_connect_timeout 3s;
proxy_send_timeout 30s;
proxy_read_timeout 45s;

proxy_buffering on;
proxy_buffer_size 16k;
proxy_buffers 32 16k;
proxy_busy_buffers_size 64k;
proxy_max_temp_file_size 64m;
