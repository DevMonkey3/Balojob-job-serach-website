# Page cache for visitors who are not signed in (docker-compose.yml, service "cache").
#
# Why it exists: building one page costs the app about 25 ms of processor time,
# so two processor cores build about 40 pages a second and no more. But a
# visitor who is not signed in gets exactly the same page as every other such
# visitor. So the page is built once, kept here, and handed to everyone else
# who asks, without touching the app at all. A page is kept until something
# public changes (the app then empties the cache, see cachectl.js), and for
# one minute at most, as a safety net.
#
#   visitor -> Caddy (HTTPS) -> this cache -> Caddy (inner door :8081) -> app / app2
#
# What comes through here: only GET requests WITHOUT a login cookie. Caddy sends
# signed-in members, staff, and every form submission straight to the app
# (deploy/aws/caddy/Caddyfile), so nothing personal can ever be stored here.
# The rules below refuse to store such things anyway, in case that ever changes.
#
# After editing this file:  sudo bash deploy/aws/update.sh --no-pull

load_module modules/ngx_http_js_module.so;

worker_processes 1;
worker_rlimit_nofile 16384;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
	worker_connections 8192;
	multi_accept on;
}

http {
	access_log off;
	server_tokens off;
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65s;
	keepalive_requests 10000;
	client_max_body_size 1m;

	# Temporary files in /tmp so the container can run without root's folders.
	client_body_temp_path /tmp/client_body;
	proxy_temp_path /tmp/proxy;
	fastcgi_temp_path /tmp/fastcgi;
	uwsgi_temp_path /tmp/uwsgi;
	scgi_temp_path /tmp/scgi;

	# Docker's own name service. "caddy" is looked up again every 10 seconds,
	# so this keeps working when the Caddy container is replaced.
	resolver 127.0.0.11 valid=10s ipv6=off;

	# The cache's "generation" number and the address that raises it (cachectl.js).
	js_shared_dict_zone zone=cachegen:32k type=number;
	js_import cachectl from /etc/nginx/cachectl.js;
	js_set $cache_gen cachectl.generation;

	# Pages: kept one minute, at most 200 MB, forgotten after 10 minutes unused.
	proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:10m
		max_size=200m inactive=10m use_temp_path=off;
	# Build files (/_next/static/): their names contain a hash of their content
	# and never change, so they are kept for 30 days.
	proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m
		max_size=300m inactive=30d use_temp_path=off;

	# Two stored versions of each page at most: gzip, and plain for the rare
	# browser that cannot unpack gzip.
	map $http_accept_encoding $page_encoding {
		default "";
		"~*gzip" "gzip";
	}

	# Never store or serve from the cache when a login cookie is present.
	map $http_cookie $has_session {
		default 0;
		"~*(^|;\s*)bj_(member|admin)=" 1;
	}
	# Never store a staff-console page (the app marks them "noindex").
	map $upstream_http_x_robots_tag $is_console {
		default 0;
		"~*noindex" 1;
	}

	# Private door for the app only: POST /purge empties the page cache. Caddy
	# never sends anything to this port, so it cannot be reached from outside.
	server {
		listen 8082;

		location = /purge {
			js_content cachectl.purge;
		}
		location / {
			return 404;
		}
	}

	server {
		listen 8080 backlog=4096;

		# For Docker's health check only.
		location = /__cache_health {
			return 204;
		}

		# Data, uploads, health and the copies' private channel: never cached.
		location /api/ {
			set $inner http://caddy:8081;
			proxy_pass $inner;
			include /etc/nginx/proxy_common.conf;
			proxy_cache off;
		}

		location /_next/static/ {
			set $inner http://caddy:8081;
			proxy_pass $inner;
			include /etc/nginx/proxy_common.conf;

			proxy_cache static;
			proxy_cache_key "$host$request_uri|$page_encoding";
			proxy_cache_valid 200 30d;
			proxy_cache_valid 404 10s;
			proxy_ignore_headers Cache-Control Expires Vary;
			proxy_cache_lock on;
			proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
			add_header X-Cache $upstream_cache_status always;
		}

		location / {
			set $inner http://caddy:8081;
			proxy_pass $inner;
			include /etc/nginx/proxy_common.conf;

			proxy_cache pages;
			# The same address gives different answers to a full page load and to
			# the browser's in-page navigation requests, so those headers are part
			# of the key.
			proxy_cache_key "$host$request_uri|$http_rsc|$http_next_router_prefetch|$http_next_router_segment_prefetch|$http_next_router_state_tree|$http_next_url|$page_encoding|$cache_gen";
			proxy_cache_valid 200 60s;

			# The app says "do not cache" on every page because it cannot know who
			# is asking. Here we do know: nobody signed in. A response that sets a
			# cookie is still never stored (nginx's own rule, left untouched).
			proxy_ignore_headers Cache-Control Expires Vary;
			proxy_cache_bypass $has_session;
			proxy_no_cache $has_session $is_console;

			# 100 people ask for the same new page at once: the app builds it once.
			proxy_cache_lock on;
			proxy_cache_lock_timeout 8s;
			proxy_cache_lock_age 8s;
			# An old copy is better than a wait or an error page: while a fresh one
			# is being built, and when the app is overloaded or restarting.
			proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
			proxy_cache_background_update on;

			add_header X-Cache $upstream_cache_status always;
		}
	}
}
