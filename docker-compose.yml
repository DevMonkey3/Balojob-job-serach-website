# Bhalojob on one server: PostgreSQL, the Next.js app and Caddy (HTTPS).
#
# Normally driven by the scripts in deploy/aws/ (see docs/aws-deploy.md).
# Every ${VALUE} comes from the env file that setup.sh creates at
# /etc/bhalojob/bhalojob.env and links here as ./.env, so the usual commands
# also work from this folder:
#
#   sudo docker compose ps
#   sudo docker compose logs -f app app2
#
# Only Caddy is reachable from outside (ports 80 and 443). The database and
# the two copies of the app listen on the private Docker network only.

name: bhalojob

# Docker keeps at most 5 x 10 MB of log per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Everything the two copies of the app have in common.
x-app: &app
  image: bhalojob-app:latest
  restart: unless-stopped
  init: true
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  volumes:
    - uploads:/data/storage
  expose:
    - "3000"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s
    start_interval: 3s
  # Caddy never lets more than a few dozen requests into one copy at a time
  # (deploy/aws/caddy/Caddyfile), so a copy stays far below this.
  mem_limit: 640m
  stop_grace_period: 30s
  logging: *logging

x-app-env: &app-env
  NODE_ENV: production
  PORT: "3000"
  HOSTNAME: 0.0.0.0
  DATABASE_URL: ${DATABASE_URL:?missing in the env file}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?missing in the env file}
  ADMIN_PATH: ${ADMIN_PATH:?missing in the env file}
  # Per copy: two copies use at most 10 of PostgreSQL's 30 connections.
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
  STORAGE_DIR: /data/storage
  # Same clock as the PCs the site was developed on. Dates in the database stay UTC.
  TZ: Asia/Tokyo
  # Heap ceiling per copy, below the container's memory limit.
  NODE_OPTIONS: --max-old-space-size=400
  # Where the app tells the page cache to forget its pages (src/server/cache-tags.ts).
  PAGE_CACHE_PURGE_URL: http://cache:8082/purge

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing in the env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in the env file}
      POSTGRES_DB: ${POSTGRES_DB:?missing in the env file}
    # Sized for a 2 GB server. The app opens at most DATABASE_POOL_MAX connections.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker,
      # so the volume goes on the parent folder (not on .../data as before 18).
      - db-data:/var/lib/postgresql
    healthcheck:
      # Over TCP on purpose: during first-time setup the server runs on its
      # socket only, and must not look ready before it has restarted for real.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 128mb
    mem_limit: 640m
    stop_grace_period: 1m
    logging: *logging

  # One-shot job: applies new migrations, and loads the master data while the
  # master tables are empty. Runs before the app on every `up`, then exits.
  migrate:
    build:
      context: .
      target: migrate
    image: bhalojob-migrate:latest
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?missing in the env file}
    logging: *logging

  # The website runs as two identical copies, "app" and "app2". Node.js uses one
  # processor core per copy, so two copies use both cores of the server, and an
  # update can replace them one at a time while the other keeps serving.
  # Each copy tells the other when a cached list changes (PEER_ORIGINS, see
  # src/server/cache-tags.ts). Logins are stored in the database, uploads on the
  # shared volume, so it does not matter which copy answers a request.
  app:
    <<: *app
    build:
      context: .
      target: runner
      args:
        NEXT_BUILD_CPUS: ${NEXT_BUILD_CPUS:-1}
    environment:
      <<: *app-env
      PEER_ORIGINS: http://app2:3000

  app2:
    <<: *app
    # Same image as "app", which is the one that builds it.
    pull_policy: never
    environment:
      <<: *app-env
      PEER_ORIGINS: http://app:3000

  # Page cache for visitors who are not signed in (deploy/aws/cache/nginx.conf).
  # A page is built once by the app and then handed to everyone else who asks,
  # until something public changes or a minute has passed. Signed-in members
  # and staff never go through it.
  cache:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/aws/cache/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/aws/cache/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      - ./deploy/aws/cache/cachectl.js:/etc/nginx/cachectl.js:ro
    expose:
      - "8080"
      # The app empties the page cache through this one. Caddy never uses it.
      - "8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__cache_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    mem_limit: 128m
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
      - app2
      - cache
    # 8081 is the inner door the cache fetches pages through. Not published.
    expose:
      - "8081"
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?missing in the env file}
      # Go's garbage collector works harder as memory nears this, well before
      # the container limit below.
      GOMEMLIMIT: 640MiB
    volumes:
      - ./deploy/aws/caddy:/etc/caddy:ro
      # Certificates live here. Losing this volume means asking Let's Encrypt again.
      - caddy-data:/data
      - caddy-config:/config
    # At most about 8,000 connections at once. A flood beyond that waits in the
    # operating system's queue instead of eating the server's memory.
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    # Per-container network settings (the host-wide ones are in setup.sh).
    sysctls:
      # A visitor who paused to read keeps the full sending speed for the next
      # click, instead of starting slowly again.
      net.ipv4.tcp_slow_start_after_idle: 0
      # Room for a burst of new connections.
      net.ipv4.tcp_max_syn_backlog: 8192
      net.core.somaxconn: 8192
    # Every open visitor connection costs Caddy roughly 150 KB while it is in
    # use. Measured: 384 MB was full at about 4,000 open connections and the
    # site stalled; 768 MB leaves room for that many with memory to spare.
    mem_limit: 768m
    logging: *logging

# Fixed names, so the data does not depend on what this folder is called.
volumes:
  db-data:
    name: bhalojob-db-data
  uploads:
    name: bhalojob-uploads
  caddy-data:
    name: bhalojob-caddy-data
  caddy-config:
    name: bhalojob-caddy-config
